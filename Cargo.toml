[package]
name = "rustfast"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["rustfast-macros"]

[[bin]]
name = "rustfast"
path = "src/main.rs"

[lib]
name = "rustfast"
path = "src/lib.rs"

[dependencies]
rustfast-macros = { path = "rustfast-macros" }
# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 工具库
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 加密（JWT HS256 自研用）
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# 数据库底座（驱动 + 连接池，非 ORM）
# QueryBuilder / Model 仍为框架自研；sqlx 仅作为统一驱动层
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any"] }

# TLS（HTTPS 支持，feature = "tls" 启用）
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[features]
default = ["sqlite"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
tls = ["dep:tokio-rustls", "dep:rustls-pemfile"]

[dev-dependencies]
tokio-test = "0.4"
rcgen = "0.13"
